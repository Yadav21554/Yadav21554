<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="100%" height="auto">
  <defs>
    <linearGradient id="dns-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="100%" stop-color="#090E1D" />
    </linearGradient>

    <linearGradient id="vnet-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1628" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#060C18" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="node-portal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111C33" />
      <stop offset="100%" stop-color="#0A1224" />
    </linearGradient>

    <linearGradient id="dns-zone-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.1" />
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8" />
    </marker>

    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981" />
    </marker>

    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#A855F7" />
    </marker>
  </defs>

  <style>
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>

  <!-- Background Base -->
  <rect width="1100" height="580" rx="14" fill="url(#dns-bg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Title Bar -->
  <g transform="translate(40, 36)">
    <rect width="520" height="28" rx="6" fill="#0B132B" stroke="#0284C7" stroke-width="0.8" />
    <circle cx="14" cy="14" r="4" fill="#38BDF8" />
    <text x="28" y="19" fill="#E2E8F0" font-size="12" font-weight="700" letter-spacing="1" class="font-mono">
      ENTERPRISE ARCHITECTURE: ZERO-TRUST PRIVATE DNS MESH
    </text>
  </g>

  <!-- Top Segment: Public Internet vs Edge (Split-Horizon) -->
  <g transform="translate(40, 80)">
    <rect width="1020" height="100" rx="10" fill="#0C1322" stroke="#334155" stroke-dasharray="4 4" stroke-width="1" />
    <text x="24" y="26" fill="#F59E0B" font-size="11" font-weight="700" letter-spacing="1.2" class="font-mono">
      ZONE 01: PUBLIC INTERNET &amp; EDGE RESOLUTION (SPLIT-HORIZON)
    </text>

    <!-- Client External -->
    <g transform="translate(40, 42)">
      <rect width="190" height="42" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="14" y="26" fill="#F8FAFC" font-size="12" font-weight="600" class="font-sans">External Internet Client</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 235 63 L 340 63" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-blue)" />
    <text x="245" y="55" fill="#94A3B8" font-size="10" class="font-mono">query</text>

    <!-- Public Resolver & Auth NS -->
    <g transform="translate(345, 42)">
      <rect width="320" height="42" rx="6" fill="#1E293B" stroke="#0284C7" stroke-width="1" />
      <text x="14" y="26" fill="#38BDF8" font-size="12" font-weight="600" class="font-sans">Public Resolver &amp; Cloudflare NS</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M 670 63 L 780 63" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-blue)" />
    <text x="685" y="55" fill="#94A3B8" font-size="10" class="font-mono">resolves</text>

    <!-- Public Ingress Web Server -->
    <g transform="translate(785, 42)">
      <rect width="200" height="42" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1" />
      <text x="14" y="21" fill="#A7F3D0" font-size="11" font-weight="700" class="font-mono">Public Ingress / DMZ</text>
      <text x="14" y="34" fill="#6EE7B7" font-size="10" class="font-mono">54.56.21.45 (Public IP)</text>
    </g>
  </g>

  <!-- Main Segment: Azure Air-Gapped VNet Boundary -->
  <g transform="translate(40, 200)">
    <rect width="1020" height="345" rx="12" fill="url(#vnet-grad)" stroke="#0284C7" stroke-width="1.5" />
    
    <!-- VNet Header Pill -->
    <rect x="20" y="16" width="370" height="26" rx="5" fill="#0369A1" fill-opacity="0.3" stroke="#0284C7" stroke-width="1" />
    <text x="32" y="33" fill="#38BDF8" font-size="11" font-weight="800" letter-spacing="1" class="font-mono">
      AZURE VNET: 10.124.0.0/16 [ZERO-TRUST AIRGAP]
    </text>

    <!-- Subnet 1: Benefits Portal Subnet -->
    <g transform="translate(30, 60)">
      <rect width="360" height="150" rx="8" fill="url(#node-portal)" stroke="#334155" stroke-width="1" />
      <text x="18" y="26" fill="#94A3B8" font-size="11" font-weight="700" class="font-mono">SUBNET: benefits-portal (10.124.0.0/24)</text>

      <g transform="translate(20, 42)">
        <rect width="320" height="85" rx="6" fill="#0F172A" stroke="#0284C7" stroke-width="1" />
        <circle cx="20" cy="24" r="5" fill="#10B981" />
        <text x="34" y="28" fill="#F8FAFC" font-size="13" font-weight="700" class="font-sans">Nginx Benefits Portal</text>
        <text x="34" y="48" fill="#38BDF8" font-size="12" font-weight="600" class="font-mono">Private IP: 10.124.0.4</text>
        <text x="34" y="68" fill="#EF4444" font-size="10" font-weight="700" class="font-mono">NO PUBLIC IP (Zero Internet Ingress)</text>
      </g>
    </g>

    <!-- Subnet 2: Workstations Subnet -->
    <g transform="translate(630, 60)">
      <rect width="360" height="150" rx="8" fill="url(#node-portal)" stroke="#334155" stroke-width="1" />
      <text x="18" y="26" fill="#94A3B8" font-size="11" font-weight="700" class="font-mono">SUBNET: workstations (10.124.1.0/24)</text>

      <g transform="translate(20, 42)">
        <rect width="320" height="85" rx="6" fill="#0F172A" stroke="#8B5CF6" stroke-width="1" />
        <text x="20" y="28" fill="#E2E8F0" font-size="13" font-weight="700" class="font-sans">Azure Virtual Desktops (AVD)</text>
        <text x="20" y="48" fill="#A78BFA" font-size="11" class="font-mono">Workstations (WS-01, WS-02, WS-03)</text>
        <text x="20" y="68" fill="#94A3B8" font-size="10" class="font-mono">Internal Resolver: 168.63.129.16</text>
      </g>
    </g>

    <!-- Bottom Center: Azure Private DNS Zone & Magic IP -->
    <g transform="translate(180, 230)">
      <rect width="660" height="95" rx="8" fill="url(#dns-zone-grad)" stroke="#0284C7" stroke-width="1.2" />
      <text x="24" y="28" fill="#38BDF8" font-size="13" font-weight="800" letter-spacing="1" class="font-mono">
        AZURE PRIVATE DNS ZONE + WIRE SERVER
      </text>

      <g transform="translate(24, 40)">
        <rect width="280" height="42" rx="4" fill="#0B132B" stroke="#0369A1" stroke-width="1" />
        <text x="14" y="19" fill="#F8FAFC" font-size="11" font-weight="700" class="font-mono">Magic IP: 168.63.129.16</text>
        <text x="14" y="32" fill="#94A3B8" font-size="10" class="font-mono">Virtual Hypervisor Resolver</text>
      </g>

      <g transform="translate(325, 40)">
        <rect width="310" height="42" rx="4" fill="#0B132B" stroke="#10B981" stroke-width="1" />
        <text x="14" y="19" fill="#34D399" font-size="11" font-weight="700" class="font-mono">Zone: veltrixrocket.internal</text>
        <text x="14" y="32" fill="#A7F3D0" font-size="10" class="font-mono">A-Record: portal -&gt; 10.124.0.4</text>
      </g>
    </g>

    <!-- Flow Arrows & Lines -->
    <!-- From Workstations down to Wire Server -->
    <path d="M 750 210 L 750 225 L 690 245" stroke="#A855F7" stroke-width="2" marker-end="url(#arrow-purple)" />
    <text x="758" y="224" fill="#C084FC" font-size="9" class="font-mono">1. Query DNS</text>

    <!-- Wire Server Resolves to 10.124.0.4 back to Workstation -->
    <path d="M 640 240 L 720 205" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-blue)" />
    <text x="610" y="215" fill="#38BDF8" font-size="9" class="font-mono">2. Returns 10.124.0.4</text>

    <!-- Direct HTTP from Workstation to Portal -->
    <path d="M 630 135 L 395 135" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)" />
    <text x="440" y="125" fill="#34D399" font-size="11" font-weight="700" class="font-mono">3. Intra-VNet TLS (10.124.0.4:443)</text>
  </g>
</svg>
