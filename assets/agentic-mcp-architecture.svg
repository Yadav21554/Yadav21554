<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="auto">
  <defs>
    <linearGradient id="ai-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="100%" stop-color="#080E1C" />
    </linearGradient>

    <linearGradient id="mcp-core" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981" />
    </marker>
  </defs>

  <style>
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>

  <!-- Base Canvas -->
  <rect width="1100" height="480" rx="14" fill="url(#ai-bg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Title Pill -->
  <g transform="translate(40, 32)">
    <rect width="580" height="28" rx="6" fill="#0B132B" stroke="#8B5CF6" stroke-width="0.8" />
    <circle cx="14" cy="14" r="4" fill="#A855F7" />
    <text x="28" y="19" fill="#E2E8F0" font-size="12" font-weight="700" letter-spacing="1" class="font-mono">
      COGNITIVE ARCHITECTURE: AUTONOMOUS AGENTS + MCP PROTOCOL
    </text>
  </g>

  <!-- Level 1: Agent Supervisor & Reasoning -->
  <g transform="translate(40, 75)">
    <rect width="1020" height="95" rx="10" fill="#0D1629" stroke="#334155" stroke-width="1.2" />
    <text x="24" y="24" fill="#38BDF8" font-size="11" font-weight="800" letter-spacing="1.2" class="font-mono">
      LAYER 01: AUTONOMOUS MULTI-AGENT SUPERVISOR (LANGGRAPH / REACT LOOPS)
    </text>

    <!-- Sub-Agent 1 -->
    <g transform="translate(30, 38)">
      <rect width="290" height="42" rx="6" fill="#1E293B" stroke="#0284C7" stroke-width="1" />
      <text x="14" y="20" fill="#F8FAFC" font-size="12" font-weight="700" class="font-sans">Orchestrator Agent</text>
      <text x="14" y="34" fill="#94A3B8" font-size="10" class="font-mono">State Machine • ReAct Cycle</text>
    </g>

    <!-- Sub-Agent 2: Guardrails -->
    <g transform="translate(360, 38)">
      <rect width="290" height="42" rx="6" fill="#1E293B" stroke="#EF4444" stroke-width="1" />
      <text x="14" y="20" fill="#FCA5A5" font-size="12" font-weight="700" class="font-sans">Zero-Trust LLM Guardrails</text>
      <text x="14" y="34" fill="#94A3B8" font-size="10" class="font-mono">OWASP Top 10 • Prompt Sanitize</text>
    </g>

    <!-- Sub-Agent 3: Output Validator -->
    <g transform="translate(690, 38)">
      <rect width="290" height="42" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1" />
      <text x="14" y="20" fill="#6EE7B7" font-size="12" font-weight="700" class="font-sans">Deterministic Schema Gate</text>
      <text x="14" y="34" fill="#94A3B8" font-size="10" class="font-mono">Pydantic v2 • Strict JSON Validation</text>
    </g>
  </g>

  <!-- Connective Arrows -->
  <path d="M 550 170 L 550 200" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-cyan)" />
  <text x="562" y="190" fill="#C084FC" font-size="10" class="font-mono">JSON-RPC 2.0 (stdio / SSE)</text>

  <!-- Level 2: Model Context Protocol (MCP) Standardized Gateway -->
  <g transform="translate(40, 205)">
    <rect width="1020" height="80" rx="10" fill="url(#mcp-core)" stroke="#8B5CF6" stroke-width="1.5" />
    <text x="24" y="26" fill="#E2E8F0" font-size="12" font-weight="800" letter-spacing="1.2" class="font-mono">
      LAYER 02: MODEL CONTEXT PROTOCOL (MCP) RUNTIME GATEWAY
    </text>
    <text x="24" y="46" fill="#C4B5FD" font-size="12" font-weight="500" class="font-sans">
      Standardized protocol isolating LLM agents from direct system access. Enforces scoped tokens, schema contracts, and audit logs.
    </text>
    <text x="24" y="64" fill="#94A3B8" font-size="11" class="font-mono">
      Tools Discovery: tools/list • Tool Execution: tools/call • Resources Subscription: resources/read
    </text>
  </g>

  <!-- Connective Arrows to 3 Tools -->
  <path d="M 200 285 L 200 320" stroke="#0284C7" stroke-width="2" marker-end="url(#arrow-cyan)" />
  <path d="M 550 285 L 550 320" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)" />
  <path d="M 900 285 L 900 320" stroke="#A855F7" stroke-width="2" marker-end="url(#arrow-cyan)" />

  <!-- Level 3: Three Tool Sandboxes / MCP Servers -->
  <g transform="translate(40, 325)">
    <!-- Sandbox 1 -->
    <g transform="translate(0, 0)">
      <rect width="320" height="120" rx="8" fill="#0C1527" stroke="#0284C7" stroke-width="1.2" />
      <rect width="320" height="3" rx="1" fill="#0284C7" />
      <text x="18" y="26" fill="#38BDF8" font-size="11" font-weight="800" class="font-mono">MCP: KUBERNETES TOOLBOX</text>
      <text x="18" y="52" fill="#E2E8F0" font-size="12" class="font-mono">• inspect_pod_anomalies()</text>
      <text x="18" y="74" fill="#E2E8F0" font-size="12" class="font-mono">• trace_ebpf_network_mesh()</text>
      <text x="18" y="96" fill="#94A3B8" font-size="11" class="font-mono">Scope: read-only | namespace-scoped</text>
    </g>

    <!-- Sandbox 2 -->
    <g transform="translate(350, 0)">
      <rect width="320" height="120" rx="8" fill="#0C1527" stroke="#10B981" stroke-width="1.2" />
      <rect width="320" height="3" rx="1" fill="#10B981" />
      <text x="18" y="26" fill="#34D399" font-size="11" font-weight="800" class="font-mono">MCP: DEVSECOPS TRIAGE GATE</text>
      <text x="18" y="52" fill="#E2E8F0" font-size="12" class="font-mono">• execute_trivy_sca_scan()</text>
      <text x="18" y="74" fill="#E2E8F0" font-size="12" class="font-mono">• draft_remediation_pr()</text>
      <text x="18" y="96" fill="#94A3B8" font-size="11" class="font-mono">Security: Cosign signed commit hooks</text>
    </g>

    <!-- Sandbox 3 -->
    <g transform="translate(700, 0)">
      <rect width="320" height="120" rx="8" fill="#0C1527" stroke="#8B5CF6" stroke-width="1.2" />
      <rect width="320" height="3" rx="1" fill="#8B5CF6" />
      <text x="18" y="26" fill="#C084FC" font-size="11" font-weight="800" class="font-mono">MCP: PRODUCTION RAG ENGINE</text>
      <text x="18" y="52" fill="#E2E8F0" font-size="12" class="font-mono">• query_hybrid_vector_store()</text>
      <text x="18" y="74" fill="#E2E8F0" font-size="12" class="font-mono">• rerank_nist_soc2_runbooks()</text>
      <text x="18" y="96" fill="#94A3B8" font-size="11" class="font-mono">Backend: pgvector + BM25 Fusion</text>
    </g>
  </g>
</svg>
