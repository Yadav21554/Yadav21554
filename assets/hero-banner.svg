<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="50%" stop-color="#080E1E" />
      <stop offset="100%" stop-color="#03060E" />
    </linearGradient>

    <radialGradient id="glow-cyan" cx="20%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-purple" cx="85%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#080C17" stop-opacity="0.85" />
    </linearGradient>

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="dot-grid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#334155" fill-opacity="0.45" />
    </pattern>

    <!-- Drop Shadows -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .status-pulse { animation: pulse 2s infinite ease-in-out; }
    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="440" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="440" rx="16" fill="url(#dot-grid)" />
  <rect width="1200" height="440" rx="16" fill="url(#glow-cyan)" />
  <rect width="1200" height="440" rx="16" fill="url(#glow-purple)" />
  <rect width="1200" height="440" rx="16" fill="none" stroke="#1E293B" stroke-width="1.5" />

  <!-- Top Status Bar -->
  <g transform="translate(60, 48)">
    <rect width="410" height="32" rx="16" fill="url(#badge-grad)" stroke="#0284C7" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="20" cy="16" r="4.5" fill="#10B981" />
    <circle cx="20" cy="16" r="8" fill="#10B981" opacity="0.3" />
    <text x="36" y="21" fill="#38BDF8" font-size="12" font-weight="700" letter-spacing="1.5" class="font-mono">
      ZERO-TRUST PERIMETER: ENFORCED
    </text>
    <text x="315" y="21" fill="#94A3B8" font-size="11" class="font-mono">| VNET-AIRGAP</text>
  </g>

  <!-- Header Right Terminal Badges -->
  <g transform="translate(860, 48)">
    <rect width="280" height="32" rx="8" fill="#0B132B" stroke="#334155" stroke-width="1" />
    <text x="18" y="21" fill="#64748B" font-size="12" class="font-mono">$</text>
    <text x="32" y="21" fill="#A5B4FC" font-size="12" class="font-mono">mesh status --all</text>
    <text x="215" y="21" fill="#10B981" font-size="12" font-weight="700" class="font-mono">[HEALTHY]</text>
  </g>

  <!-- Hero Main Name & Identity -->
  <g transform="translate(60, 150)">
    <text x="0" y="0" fill="url(#title-grad)" font-size="54" font-weight="900" letter-spacing="-1" class="font-sans">
      SUNNY YADAV
    </text>
    <text x="0" y="42" fill="#94A3B8" font-size="19" font-weight="500" letter-spacing="0.2" class="font-sans">
      Enterprise Cloud DevSecOps Architect &amp; Agentic Systems Engineer
    </text>
    <text x="0" y="74" fill="#64748B" font-size="14" font-weight="400" class="font-mono">
      HYPERSCALE CLOUD INFRASTRUCTURE <tspan fill="#38BDF8">•</tspan> ZERO-TRUST NETWORKING <tspan fill="#38BDF8">•</tspan> MODEL CONTEXT PROTOCOL (MCP) <tspan fill="#38BDF8">•</tspan> PRODUCTION RAG
    </text>
  </g>

  <!-- 3 Luxury Architectural Pillars Cards -->
  <g transform="translate(60, 275)">
    <!-- Pillar 1 -->
    <g transform="translate(0, 0)" filter="url(#card-shadow)">
      <rect width="345" height="115" rx="12" fill="url(#card-grad)" stroke="#1E293B" stroke-width="1.2" />
      <rect width="345" height="4" rx="2" fill="#0EA5E9" />
      <text x="22" y="32" fill="#38BDF8" font-size="12" font-weight="800" letter-spacing="1.2" class="font-mono">
        01 / CLOUD &amp; NETWORKING
      </text>
      <text x="22" y="60" fill="#F8FAFC" font-size="15" font-weight="700" class="font-sans">
        Zero-Trust Azure &amp; K8s Mesh
      </text>
      <text x="22" y="84" fill="#94A3B8" font-size="12" class="font-mono">
        Private DNS Zones • VNet Peering • AKS
      </text>
      <text x="22" y="100" fill="#64748B" font-size="11" class="font-mono">
        RFC 1918 Microsegmentation • Terraform
      </text>
    </g>

    <!-- Pillar 2 -->
    <g transform="translate(365, 0)" filter="url(#card-shadow)">
      <rect width="345" height="115" rx="12" fill="url(#card-grad)" stroke="#1E293B" stroke-width="1.2" />
      <rect width="345" height="4" rx="2" fill="#8B5CF6" />
      <text x="22" y="32" fill="#A78BFA" font-size="12" font-weight="800" letter-spacing="1.2" class="font-mono">
        02 / DEVSECOPS &amp; RUNTIME
      </text>
      <text x="22" y="60" fill="#F8FAFC" font-size="15" font-weight="700" class="font-sans">
        Shift-Left Security &amp; GitOps
      </text>
      <text x="22" y="84" fill="#94A3B8" font-size="12" class="font-mono">
        HashiCorp Vault • Cosign Image Signing
      </text>
      <text x="22" y="100" fill="#64748B" font-size="11" class="font-mono">
        Trivy / Snyk Gates • OPA Gatekeeper
      </text>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(730, 0)" filter="url(#card-shadow)">
      <rect width="345" height="115" rx="12" fill="url(#card-grad)" stroke="#1E293B" stroke-width="1.2" />
      <rect width="345" height="4" rx="2" fill="#10B981" />
      <text x="22" y="32" fill="#34D399" font-size="12" font-weight="800" letter-spacing="1.2" class="font-mono">
        03 / COGNITIVE AI SYSTEMS
      </text>
      <text x="22" y="60" fill="#F8FAFC" font-size="15" font-weight="700" class="font-sans">
        Model Context Protocol &amp; RAG
      </text>
      <text x="22" y="84" fill="#94A3B8" font-size="12" class="font-mono">
        Standardized MCP Servers • Tool Sandboxes
      </text>
      <text x="22" y="100" fill="#64748B" font-size="11" class="font-mono">
        Hybrid Vector RAG • Autonomous Swarms
      </text>
    </g>
  </g>
</svg>
